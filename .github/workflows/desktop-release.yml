name: Publish FivemShop Windows
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fivemshop-windows-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Plan release
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'A stable version number is required.' }
          $tag = "v$version"
          $existing = gh release view $tag --json isDraft --repo $env:GITHUB_REPOSITORY 2>$null
          $exists = $LASTEXITCODE -eq 0
          $needed = -not $exists -or ($existing | ConvertFrom-Json).isDraft
          "needed=$($needed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Install pinned package manager
        if: steps.plan.outputs.needed == 'true'
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        if: steps.plan.outputs.needed == 'true'
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Build Windows installer
        if: steps.plan.outputs.needed == 'true'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --win nsis --x64 --publish never
      - name: Publish complete update
        if: steps.plan.outputs.needed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          $installer = Get-Item "desktop/release/FivemShop-Setup-$env:RELEASE_VERSION.exe"
          $metadata = Get-Item 'desktop/release/latest.yml'
          $blockmap = Get-Item "$($installer.FullName).blockmap"
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --target $env:GITHUB_SHA --title "FivemShop $env:RELEASE_VERSION" --notes-file desktop/RELEASE-NOTES.md --draft --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Creating the draft release failed.' }
          }
          gh release upload $env:RELEASE_TAG $installer.FullName $metadata.FullName $blockmap.FullName --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Uploading the release failed.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the release failed.' }
